[project]
name = "risk-scoring-service"
version = "0.1.0"
description = "30-day readmission risk scoring service operated under simulated production"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "mlflow>=2.16",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "lightgbm>=4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "scripts"]
# tests is on the path so scripts can resolve the test factories they reuse.
mypy_path = "src:tests"

# scikit-learn ships no py.typed marker, so its symbols resolve to Any.
# Scoped to sklearn only; every other import stays strictly checked.
[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
