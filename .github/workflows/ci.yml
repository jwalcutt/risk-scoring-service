name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: risk
          POSTGRES_PASSWORD: risk
          POSTGRES_DB: risk_scoring
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U risk -d risk_scoring"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check src tests scripts

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests scripts

      - name: Type check (mypy)
        run: uv run mypy src scripts

      - name: Test (pytest)
        run: uv run pytest
        env:
          RISK_SCORING_REQUIRE_DB: "1"
          RISK_SCORING_DATABASE_URL: postgresql://risk:risk@localhost:5433/risk_scoring

      - name: Evaluation gate (synthetic population)
        run: uv run python scripts/run_gate_ci.py --report gate_report.md

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gate-report
          path: gate_report.md
          if-no-files-found: ignore
