name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the checkout. Nothing here writes to the repository,
# so the token gets no more than that.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: risk
          POSTGRES_PASSWORD: risk
          POSTGRES_DB: risk_scoring
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U risk -d risk_scoring"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      # Audits every pin in uv.lock against the PyPI advisory database and
      # fails the build on any hit that is not listed below. The export drops
      # the editable project entry, which pip-audit cannot resolve, and the
      # audit runs without pip, so the lock is checked exactly as written for
      # the Python version it targets instead of being re-resolved.
      #
      # Each ignored advisory needs a reason here and an issue tracking it.
      - name: Audit dependencies (pip-audit)
        run: |
          uv export --no-hashes --frozen --no-emit-project -o requirements-audit.txt
          uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps --disable-pip \
            --progress-spinner off \
            --ignore-vuln CVE-2026-69247 \
            --ignore-vuln CVE-2026-71211
        # CVE-2026-69247 (PYSEC-2026-3552, GHSA-g6cj-pr64-35w5): cryptography
        # 49.0.0 leaks a Bleichenbacher oracle from PKCS#7 decryption. Nothing
        # in this repository decrypts PKCS#7. The fix is 50.0.0, and mlflow
        # 3.15.x pins cryptography below 50, so the bump waits on the mlflow
        # upgrade that #18 tracks.
        #
        # CVE-2026-71211 (GHSA-h7x2-h6g9-p789): mlflow 3.13.0 through 3.15.2
        # accepts an unvalidated api_base when creating a gateway secret and
        # will proxy to it (SSRF). No release fixes it; 3.16.0 ships the same
        # handler. This repository never runs the AI gateway and only serves
        # the tracking UI on loopback. Tracked in #18.

      - name: Lint (ruff check)
        run: uv run ruff check src tests scripts

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests scripts

      - name: Type check (mypy)
        run: uv run mypy src scripts

      - name: Test (pytest)
        run: uv run pytest
        env:
          RISK_SCORING_REQUIRE_DB: "1"
          RISK_SCORING_DATABASE_URL: postgresql://risk:risk@localhost:5433/risk_scoring

      - name: Evaluation gate (synthetic population)
        run: uv run python scripts/run_gate_ci.py --report gate_report.md

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gate-report
          path: gate_report.md
          if-no-files-found: ignore
