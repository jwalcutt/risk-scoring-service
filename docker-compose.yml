# The whole stack: a database, a one-shot schema migration, and the service.
#
# Start it from the repository root. Compose interpolates ${PWD} into the
# registry mounts and the service's working directory, so the absolute
# file:// artifact URIs recorded in mlflow.db resolve to the same paths
# inside the container as on the host, and any clone works unedited.
services:
  postgres:
    # Digest recorded in docs/service-notes.md; bump tag and digest together.
    image: postgres:17.6-alpine
    # The risk/risk defaults exist so a fresh clone comes up with one command.
    # They are acceptable only because the port below is published on
    # loopback: nothing off the machine can reach the database. For anything
    # else, set POSTGRES_PASSWORD in a gitignored .env file beside this file;
    # Compose reads it, and host-side commands need the matching
    # RISK_SCORING_DATABASE_URL in the same place.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risk}
      POSTGRES_DB: ${POSTGRES_DB:-risk_scoring}
    ports:
      # Bound to 127.0.0.1, not every interface. The migrate and app services
      # reach Postgres over the compose network, so only host-side commands
      # use this port, and they all connect to localhost.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-risk} -d ${POSTGRES_DB:-risk_scoring}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Schema changes are a separate one-shot service, so the running service
  # never issues DDL and restarting it is a pure restart.
  migrate:
    build: &service-image
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: risk-scoring-service:dev
    command: ["python", "-m", "risk_scoring.db", "migrate"]
    environment:
      # The service follows POSTGRES_DB, so setting that alone renames the
      # whole stack's database. SERVICE_DB overrides it for the check
      # scripts, which point the app at a throwaway database they created
      # on the same server (scripts/compose_support.py).
      RISK_SCORING_DATABASE_URL: &service-dsn
        postgresql://${POSTGRES_USER:-risk}:${POSTGRES_PASSWORD:-risk}@postgres:5432/${SERVICE_DB:-${POSTGRES_DB:-risk_scoring}}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: *service-image
    image: risk-scoring-service:dev
    working_dir: ${PWD}
    environment:
      RISK_SCORING_DATABASE_URL: *service-dsn
    volumes:
      # The registry stays one store on the host. The database is read-only;
      # mlruns is not, because loading a models:/ URI rewrites a derived
      # metadata file beside the artifact. See docs/service-notes.md.
      - ${PWD}/mlflow.db:${PWD}/mlflow.db:ro
      - ${PWD}/mlruns:${PWD}/mlruns
      - ${PWD}/configs:${PWD}/configs:ro
    ports:
      # Host port 8001, not 8000, so an app already listening on the usual
      # port never collides with the stack. Same reasoning as Postgres 5433.
      - "${SERVICE_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health")
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
